<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Admin Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="admin.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
    <script src="config.js"></script>
</head>

<body>
    <div class="lg">
        <div class="art">
            <div class="logo"><i><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M6 7h12l1 13H5L6 7z" />
                        <path d="M9 7a3 3 0 016 0" />
                    </svg></i><span id="sn"></span></div>
            <div>
                <h2>Manage your store in one place.</h2>
                <p>Add products, organise categories and keep your deals fresh, from any device.</p>
            </div><span style="color:#94a3b8;font-size:.8rem">Private area for store admins</span>
        </div>
        <div class="fm">
            <form id="f">
                <div>
                    <h1>Welcome back</h1>
                    <p class="mu" style="margin:6px 0 0">Sign in to open your dashboard.</p>
                </div>
                <div class="err" id="e" hidden></div>
                <label class="f">Email<input class="in" id="em" type="email" placeholder="you@example.com"
                        autocomplete="username" required></label>
                <label class="f">Password<span class="pw"><input class="in" id="pw" type="password"
                            placeholder="Your password" autocomplete="current-password" required><button type="button"
                            id="tg">Show</button></span></label>
                <button class="btn p" id="b" style="height:50px">Sign in</button><a class="mu" href="./"
                    style="text-align:center;font-size:.85rem">Back to store</a>
            </form>
        </div>
    </div>
    <script>
        const $ = id => document.getElementById(id); $('sn').textContent = CFG.SITE;
        $('tg').onclick = () => { const s = $('pw').type == 'password'; $('pw').type = s ? 'text' : 'password'; $('tg').textContent = s ? 'Hide' : 'Show' };
        const err = m => { $('e').textContent = m; $('e').hidden = !m };
        if (!CFG.URL.startsWith('http')) err('Setup needed: add your Supabase URL and key in config.js.');
        else {
            const db = supabase.createClient(CFG.URL, CFG.KEY);
            db.auth.getSession().then(({ data }) => { if (data.session) location.href = 'admin.html' });
            $('f').onsubmit = async e => {
                e.preventDefault(); err(''); $('b').disabled = true; $('b').textContent = 'Signing in…';
                const { error } = await db.auth.signInWithPassword({ email: $('em').value.trim(), password: $('pw').value });
                if (error) { err(error.message); $('b').disabled = false; $('b').textContent = 'Sign in' } else location.href = 'admin.html'
            }
        }
    </script>
</body>

</html>
