<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Admin Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="admin.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
    <script src="config.js"></script>
</head>

<body>
    <div class="app">
        <aside class="side">
            <div class="logo"><i><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M6 7h12l1 13H5L6 7z" />
                        <path d="M9 7a3 3 0 016 0" />
                    </svg></i><span id="sn"></span></div>
            <button class="nv on" data-v="p"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M6 7h12l1 13H5L6 7z" />
                    <path d="M9 7a3 3 0 016 0" />
                </svg>Products</button><button class="nv" data-v="c"><svg width="20" height="20" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 12l-8 8-9-9V3h8z" />
                    <circle cx="7.5" cy="7.5" r="1.5" />
                </svg>Categories</button>
            <div class="sp"></div>
            <a class="nv" href="./" target="_blank"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M5 12h14M13 6l6 6-6 6" />
                </svg><span>Store</span></a><button class="nv" id="lo"><svg width="20" height="20" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9" />
                </svg><span>Log out</span></button>
        </aside>
        <main>
            <div class="top">
                <div>
                    <h1 id="ti">Products</h1>
                    <p id="su">Manage what customers see in your store.</p>
                </div><button class="btn p" id="add"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 5v14M5 12h14" />
                    </svg>Add product</button>
            </div>
            <div class="stats">
                <div class="st"><i><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M6 7h12l1 13H5L6 7z" />
                            <path d="M9 7a3 3 0 016 0" />
                        </svg></i>
                    <div><b id="s1">0</b><span>Products</span></div>
                </div>
                <div class="st"><i><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 12l-8 8-9-9V3h8z" />
                            <circle cx="7.5" cy="7.5" r="1.5" />
                        </svg></i>
                    <div><b id="s2">0</b><span>Categories</span></div>
                </div>
                <div class="st"><i><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="3" width="18" height="18" rx="3" />
                            <circle cx="9" cy="9" r="2" />
                            <path d="M21 15l-5-5L5 21" />
                        </svg></i>
                    <div><b id="s3">0</b><span>Images</span></div>
                </div>
            </div>
            <section id="vp">
                <div class="box">
                    <div class="bar"><input class="in" id="q" placeholder="Search products"><select class="in"
                            id="fc"></select></div>
                    <div id="pl"></div>
                </div>
            </section>
            <section id="vc" hidden>
                <div class="box">
                    <div class="cat"><input class="in" id="cn" placeholder="New category name (e.g. Gadgets)"><button
                            class="btn p" id="ac">Add</button></div>
                    <div id="cl"></div>
                </div>
            </section>
        </main>
    </div>
    <div class="ov" id="ov"></div>
    <aside class="dr" id="dr">
        <header>
            <h2 id="dt">Add product</h2><button class="ib" id="dx" aria-label="Close">&times;</button>
        </header>
        <div class="bd"><label class="f">Title<input class="in" id="t" placeholder="e.g. Wireless Earbuds Pro"></label>
            <div class="g2"><label class="f">Price<input class="in" id="pr"
                        placeholder="e.g. ₦14,500 or $9.99"></label><label class="f">Category<select class="in"
                        id="ct"></select></label></div>
            <label class="f">AliExpress affiliate link<input class="in" id="u" type="url"
                    placeholder="https://s.click.aliexpress.com/..."></label>
            <label class="f">Description <span>Optional</span><textarea class="in" id="d"
                    placeholder="What makes this product worth buying?"></textarea></label>
            <div><label class="drop" id="dz"><input type="file" id="f" accept="image/*" multiple hidden><b>Click or drop
                        images here</b>You can add several. Click an image to make it the cover.</label>
                <div class="pv" id="pv"></div>
            </div>
        </div>
        <footer><button class="btn" id="cc">Cancel</button><button class="btn p" id="sv">Save product</button></footer>
    </aside>
    <div id="ts"></div>
    <div id="cf">
        <div>
            <h3 id="ch"></h3>
            <p id="cp"></p>
            <div class="a"><button class="btn" id="cn2">Cancel</button><button class="btn d" id="cy">Delete</button>
            </div>
        </div>
    </div>
    <script>
        const $ = id => document.getElementById(id); let db, C = [], P = [], imgs = [], eid = null; $('sn').textContent = CFG.SITE;
        const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const IC = { ed: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.500a2.100 2.100 0 013 3L7 19l-4 1 1-4z"/></svg>', tr: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>', lk: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M8 7h9v9"/></svg>' };
        const toast = (m, t = '') => { const e = document.createElement('div'); e.className = 't ' + t; e.textContent = m; $('ts').append(e); setTimeout(() => e.remove(), 3200) };
        const ask = (h, p) => new Promise(r => { $('ch').textContent = h; $('cp').textContent = p; $('cf').classList.add('on'); const d = v => { $('cf').classList.remove('on'); r(v) }; $('cy').onclick = () => d(1); $('cn2').onclick = () => d(0) });
        (async () => {
            if (!CFG.URL.startsWith('http')) return location.href = 'login.html'; db = supabase.createClient(CFG.URL, CFG.KEY);
            const { data } = await db.auth.getSession(); if (!data.session) return location.href = 'login.html';
            db.auth.onAuthStateChange((e, s) => { if (!s) location.href = 'login.html' }); load()
        })();
        $('lo').onclick = async () => { await db.auth.signOut(); location.href = 'login.html' };
        document.querySelectorAll('[data-v]').forEach(b => b.onclick = () => { const v = b.dataset.v; document.querySelectorAll('[data-v]').forEach(x => x.classList.toggle('on', x === b)); $('vp').hidden = v != 'p'; $('vc').hidden = v != 'c'; $('add').hidden = v != 'p'; $('ti').textContent = v == 'p' ? 'Products' : 'Categories'; $('su').textContent = v == 'p' ? 'Manage what customers see in your store.' : 'Group products so customers can find them faster.' });
        async function load() {
            const [a, b] = await Promise.all([db.from('categories').select('*').order('name'), db.from('products').select('*').order('created_at', { ascending: false })]);
            if (a.error || b.error) toast('Could not load data. Did you run supabase-setup.sql?', 'e'); C = a.data || []; P = b.data || [];
            $('s1').textContent = P.length; $('s2').textContent = C.length; $('s3').textContent = P.reduce((n, p) => n + (p.images || []).length, 0);
            const o = C.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join(''); $('ct').innerHTML = o || '<option value="">No categories yet</option>';
            const cur = $('fc').value; $('fc').innerHTML = '<option value="">All categories</option>' + o; $('fc').value = cur; rp(); rc()
        }
        const cn = id => (C.find(c => c.id === id) || {}).name || 'Uncategorised';
        const EMPTY = '<svg viewBox="0 0 120 90" fill="none" stroke="currentColor" stroke-width="2.500" stroke-linecap="round"><rect x="25" y="28" width="70" height="52" rx="10" opacity=".4"/><path d="M45 28a15 15 0 0130 0" opacity=".4"/></svg>';
        function rp() {
            const q = $('q').value.toLowerCase(), f = +$('fc').value; const l = P.filter(p => p.title.toLowerCase().includes(q) && (!f || p.category_id === f));
            $('pl').innerHTML = l.length ? l.map(p => `<div class="row"><img src="${esc((p.images || [])[0])}" alt=""><div class="m"><b>${esc(p.title)}</b><span><span class="pill">${esc(cn(p.category_id))}</span>${esc(p.price)}</span></div><a class="ib l" href="${esc(p.affiliate_url)}" target="_blank" rel="noopener" title="Open link">${IC.lk}</a><button class="ib" onclick="edit(${p.id})" title="Edit">${IC.ed}</button><button class="ib x" onclick="del(${p.id})" title="Delete">${IC.tr}</button></div>`).join('') : `<div class="empty">${EMPTY}<h3>${P.length ? 'No matches' : 'No products yet'}</h3><p>${P.length ? 'Try a different search.' : 'Add your first product to replace the demo items in your store.'}</p></div>`
        }
        function rc() { $('cl').innerHTML = C.length ? C.map(c => `<div class="row"><div class="m"><b>${esc(c.name)}</b><span>${P.filter(p => p.category_id === c.id).length} products</span></div><button class="ib x" onclick="delCat(${c.id})" title="Delete">${IC.tr}</button></div>`).join('') : `<div class="empty">${EMPTY}<h3>No categories yet</h3><p>Create one above, then assign products to it.</p></div>` }
        $('q').oninput = rp; $('fc').onchange = rp;
        $('ac').onclick = async () => { const n = $('cn').value.trim(); if (!n) return toast('Enter a category name', 'e'); const { error } = await db.from('categories').insert({ name: n }); if (error) return toast(error.message, 'e'); $('cn').value = ''; toast('Category added', 's'); load() };
        $('cn').onkeydown = e => e.key == 'Enter' && $('ac').click();
        async function delCat(id) { if (await ask('Delete category?', 'Products in it will become uncategorised.')) { await db.from('categories').delete().eq('id', id); toast('Category deleted'); load() } }
        async function del(id) { if (await ask('Delete product?', 'This removes it from your store. This cannot be undone.')) { await db.from('products').delete().eq('id', id); toast('Product deleted'); load() } }
        const open = v => { $('dr').classList.toggle('on', v); $('ov').classList.toggle('on', v) };
        function reset() { eid = null; imgs = [];['t', 'pr', 'u', 'd', 'f'].forEach(i => $(i).value = ''); $('dt').textContent = 'Add product'; pv() }
        $('add').onclick = () => { reset(); open(1) }; $('dx').onclick = $('cc').onclick = $('ov').onclick = () => open(0);
        function edit(id) { const p = P.find(x => x.id === id); reset(); eid = id; imgs = (p.images || []).map(u => ({ u })); $('t').value = p.title; $('pr').value = p.price || ''; if (p.category_id) $('ct').value = p.category_id; $('u').value = p.affiliate_url; $('d').value = p.description || ''; $('dt').textContent = 'Edit product'; pv(); open(1) }
        function pv() { $('pv').innerHTML = imgs.map((m, i) => `<div class="${i ? '' : 'cv'}" onclick="cover(${i})"><img src="${esc(m.u)}" alt="">${i ? '' : '<em>Cover</em>'}<button onclick="event.stopPropagation();imgs.splice(${i},1);pv()">&times;</button></div>`).join('') }
        const cover = i => { imgs.unshift(imgs.splice(i, 1)[0]); pv() };
        const add = fs => { [...fs].filter(f => f.type.startsWith('image/')).forEach(f => imgs.push({ u: URL.createObjectURL(f), f })); pv() };
        $('f').onchange = e => { add(e.target.files); e.target.value = '' };
        ['dragover', 'dragenter'].forEach(n => $('dz').addEventListener(n, e => { e.preventDefault(); $('dz').classList.add('ov2') }));['dragleave', 'drop'].forEach(n => $('dz').addEventListener(n, e => { e.preventDefault(); $('dz').classList.remove('ov2') })); $('dz').addEventListener('drop', e => add(e.dataTransfer.files));
        $('sv').onclick = async () => {
            const b = $('sv'), t = $('t').value.trim(), u = $('u').value.trim();
            if (!t) return toast('Please enter a title', 'e'); try { new URL(u) } catch { return toast('Enter a valid affiliate link (starting with https://)', 'e') }
            if (!imgs.length) return toast('Add at least one image', 'e'); b.disabled = true;
            try {
                const urls = []; let n = 0; for (const m of imgs) { if (m.f) { b.textContent = `Uploading ${++n}...`; const path = `${Date.now()}-${m.f.name.replace(/[^\w.-]/g, '_')}`; const { error } = await db.storage.from('products').upload(path, m.f); if (error) throw error; urls.push(db.storage.from('products').getPublicUrl(path).data.publicUrl) } else urls.push(m.u) }
                b.textContent = 'Saving...'; const row = { title: t, price: $('pr').value.trim(), category_id: +$('ct').value || null, affiliate_url: u, description: $('d').value.trim(), images: urls };
                const { error } = eid ? await db.from('products').update(row).eq('id', eid) : await db.from('products').insert(row); if (error) throw error;
                open(0); toast(eid ? 'Product updated' : 'Product added', 's'); load()
            } catch (e) { toast(e.message || 'Something went wrong', 'e') } b.disabled = false; b.textContent = 'Save product'
        };
    </script>
</body>

</html>
